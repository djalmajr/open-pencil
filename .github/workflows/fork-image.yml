name: Fork Cloud image

on:
  workflow_dispatch:
  push:
    branches: ['djalmajr/**']

permissions:
  contents: read

concurrency:
  group: fork-cloud-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and build admin
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup/workspace
        with:
          lfs: 'true'
          lfs-include: tests/fixtures/gold-preview.fig
          cache-scope: fork-cloud-image
      - name: Verify LFS fixture
        run: test -s tests/fixtures/gold-preview.fig && ! grep -a -q -F -x 'version https://git-lfs.github.com/spec/v1' tests/fixtures/gold-preview.fig
      - name: Build the HTML engine's WebAssembly module
        run: bun run --filter @open-pencil/html-engine build:wasm
      - name: Build workspace packages
        run: bun run build:packages
      - name: Test export isolation
        run: bun test tests/integration/collab/inf37-export-isolation.test.ts packages/core/tests/io/formats/fig/export/patch/index.test.ts packages/core/tests/io/formats/fig/roundtrip/sibling-order.test.ts --timeout 180000
      - name: Test heavy export isolation
        env:
          BUN_HEAVY_TESTS: 'true'
        run: bun test tests/integration/collab/inf37-export-isolation-heavy.test.ts --timeout 180000
      - name: Build admin bundle
        run: bun build packages/cloud/src/runtime/node/admin.ts --target=node --format=esm --outfile=admin.mjs
      - name: Hash admin bundle
        run: sha256sum admin.mjs > admin.mjs.sha256
      - name: Summarize admin bundle
        run: cat admin.mjs.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-mjs
          path: |
            admin.mjs
            admin.mjs.sha256
          retention-days: 90
          if-no-files-found: error

  image:
    name: Build Cloud image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup/workspace
        with:
          cache-scope: fork-cloud-image
      - name: Build the HTML engine's WebAssembly module
        run: bun run --filter @open-pencil/html-engine build:wasm
      - name: Set short revision
        id: revision
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/djalmajr/open-pencil-cloud
          tags: |
            type=raw,value=0.17.0-djalmajr.${{ steps.revision.outputs.short }}
            type=raw,value=sha-${{ github.sha }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND MIT
            org.opencontainers.image.source=https://github.com/djalmajr/open-pencil
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: packages/cloud/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=fork-cloud-image
          cache-to: type=gha,scope=fork-cloud-image,mode=max
      - name: Summarize published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          echo "Published manifest digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
